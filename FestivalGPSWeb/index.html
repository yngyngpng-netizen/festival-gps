<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050611">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Festival GPS">
    <title>Festival GPS</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">FG</span>
          <div>
            <h1>Festival GPS</h1>
            <p id="currentContext">Friday May 15 • 5:00 PM</p>
          </div>
        </div>
        <div class="toolbar">
          <button class="icon-button" id="friendsButton" type="button" aria-label="Friends">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0-3.46-6A4.5 4.5 0 0 1 14 8.35V9a4.47 4.47 0 0 1-.93 2.73A5.8 5.8 0 0 1 16 11Zm-8 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.31 0-6 2.01-6 4.5V20h12v-1.5C14 16.01 11.31 14 8 14Zm8-1c-.69 0-1.36.09-1.98.26A6.36 6.36 0 0 1 16 18.5V20h6v-1.5c0-2.49-2.69-4.5-6-4.5Z"/></svg>
          </button>
          <button class="icon-button" id="profileButton" type="button" aria-label="Profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Zm7-6V5h-3V3h3V0h2v3h3v2h-3v3Z"/></svg>
          </button>
          <button class="icon-button primary" id="scheduleButton" type="button" aria-label="Import schedule">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-1 14H6l3-4 2.2 2.95L14.5 11 18 17ZM8.5 9.5A1.5 1.5 0 1 1 10 8a1.5 1.5 0 0 1-1.5 1.5Z"/></svg>
          </button>
        </div>
      </header>

      <main class="map-shell">
        <section id="map" class="map" aria-label="EDC Las Vegas 2026 map">
          <div class="map-photo"></div>
          <div class="fallback-map" aria-hidden="true">
            <div class="speedway outer"></div>
            <div class="speedway inner"></div>
            <div class="path vertical"></div>
            <div class="path cross"></div>
          </div>
          <div id="stageLayer" class="stage-layer"></div>
          <div id="pinLayer" class="pin-layer"></div>
        </section>
      </main>

      <section class="timeline-panel" aria-label="Timeline">
        <div class="timeline-row">
          <div id="dayButtons" class="segmented"></div>
          <output id="timeOutput">5:00 PM</output>
        </div>
        <input id="timeRange" class="time-range" type="range" min="1020" max="1770" step="5" value="1020">
        <div class="timeline-labels">
          <span id="startTimeLabel">5:00 PM</span>
          <span id="endTimeLabel">5:30 AM</span>
        </div>
        <div id="friendStrip" class="friend-strip" aria-label="Friend status"></div>
      </section>
    </div>

    <dialog id="friendsDialog">
      <form method="dialog" class="sheet">
        <header class="sheet-header">
          <h2>Friends</h2>
          <button class="icon-button ghost" value="cancel" type="submit" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z"/></svg>
          </button>
        </header>
        <div id="friendList" class="friend-list"></div>
        <div class="import-panel">
          <label for="friendCode">Import friend code</label>
          <textarea id="friendCode" rows="3" spellcheck="false"></textarea>
          <button id="importFriendButton" class="action-button" type="button">Import</button>
          <p id="friendImportMessage" class="muted"></p>
        </div>
      </form>
    </dialog>

    <dialog id="profileDialog">
      <form method="dialog" class="sheet">
        <header class="sheet-header">
          <h2>Profile</h2>
          <button class="icon-button ghost" value="cancel" type="submit" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z"/></svg>
          </button>
        </header>
        <div class="profile-grid">
          <div id="profilePreview" class="large-avatar">YO</div>
          <div class="field-stack">
            <label for="profileName">Name</label>
            <input id="profileName" type="text" autocomplete="name">
            <label for="profilePhoto">Profile picture</label>
            <input id="profilePhoto" type="file" accept="image/*">
          </div>
        </div>
        <div class="button-row">
          <button id="saveProfileButton" class="action-button" type="button">Save</button>
          <button id="copyPinButton" class="action-button secondary" type="button">Copy pin code</button>
        </div>
        <p id="profileMessage" class="muted"></p>
      </form>
    </dialog>

    <dialog id="scheduleDialog">
      <form method="dialog" class="sheet tall">
        <header class="sheet-header">
          <h2>Schedule</h2>
          <button class="icon-button ghost" value="cancel" type="submit" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z"/></svg>
          </button>
        </header>
        <div class="form-grid">
          <label for="scheduleDay">Day</label>
          <select id="scheduleDay">
            <option value="friday">Friday May 15</option>
            <option value="saturday">Saturday May 16</option>
            <option value="sunday">Sunday May 17</option>
          </select>
          <label for="scheduleImage">Schedule picture</label>
          <input id="scheduleImage" type="file" accept="image/*">
        </div>
        <div id="ocrStatus" class="progress-line"></div>
        <textarea id="ocrText" class="ocr-text" rows="7" spellcheck="false"></textarea>
        <div class="button-row">
          <button id="demoScheduleButton" class="action-button secondary" type="button">Demo</button>
          <button id="applyScheduleButton" class="action-button" type="button">Apply</button>
        </div>
        <div id="parsedSchedule" class="parsed-list"></div>
      </form>
    </dialog>
  </body>
</html>
